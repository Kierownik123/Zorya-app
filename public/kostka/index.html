<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz o Św. Stanisławie Kostce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-shell">
        <header class="app-header">
            <div class="badge">Quiz</div>
            <h1>Quiz o Św. Stanisławie Kostce</h1>
            <p>Gotowy do gry — wybierz odpowiedzi i sprawdź wynik.</p>
        </header>

        <main class="quiz-wrapper">
            <form id="quizForm"></form>

            <aside class="result-panel">
                <h2>Wynik</h2>
                <div id="score" class="score">0 / 7</div>
                <p id="summary">Rozwiąż wszystkie pytania i sprawdź wynik.</p>
            </aside>
        </main>
    </div>

    <script src="main.js"></script>
</body>

</html>
