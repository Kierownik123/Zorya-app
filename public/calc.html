<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorya-Calc</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="shortcut icon" href="logo.ico.ico" type="image/x-icon">
</head>

<body>
    <header class="logo-header">
        <img src="logo.png" alt="Zorya logo" class="logo">
    </header>
    <form class="container">
        <fieldset>
            <label for="liczba1">Pierwsza liczba</label>
            <input type="number" id="liczba1" placeholder="Pierwsza liczba">

            <label for="liczba2">Druga liczba</label>
            <input type="number" id="liczba2" placeholder="Druga liczba">
        </fieldset>

        <div class="grid">
            <button type="button" class="contrast">+</button>
            <button type="button" class="contrast">-</button>
            <button type="button" class="contrast">/</button>
            <button type="button" class="contrast">*</button>
            <button type="button" class="contrast">^</button>
            <button type="button" class="contrast">√</button>
        </div>

        <p id="wynik">Wynik: 0</p>
        <script type="module" src="browser.js"></script>
    </form>

</body>
<footer>
    <p><a href="http://github.com/wxn0brP/Zhiva" target="_blank">Zhiva</a></p>
    <p>Stronę wykonał: <a href="https://github.com/Kierownik123"><b>Kierownik123</b></a></p>
</footer>

</html>
