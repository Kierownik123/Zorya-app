<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz o Różańcu Świętym</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-shell">
        <header class="app-header">
            <div class="badge">Quiz</div>
            <h1>Quiz o Różańcu Świętym</h1>
            <p>Gotowy do gry — wybierz odpowiedzi i kliknij <strong></strong>sprawdź wynik</strong>.</p>
        </header>

        <main class="quiz-wrapper">
            <form id="quizForm"></form>

            <aside class="result-panel">
                <h2>Wynik</h2>
                <div id="score" class="score">0 / 14</div>
                <p id="summary">Rozwiąż wszystkie pytania i sprawdź wynik.</p>
            </aside>
        </main>
    </div>
    <footer>
        <p style="text-align: center; font-size:15px">Michał Radosław Gładysz &copy; 2026 Quiz o Różańcu Świętym.
            Wszelkie
            prawa zastrzeżone.</p>
    </footer>

    <script src="main.js"></script>
</body>

</html>
